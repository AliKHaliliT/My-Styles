name: CI

# Runs the five commands AGENTS.md documents, so a rule the configuration claims to enforce
# is actually enforced rather than remembered.
# Actions ride major-version tags so a child of this template starts current; pin them to commit digests when your threat model warrants hardening.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Record immutability is checked against history, so the clone cannot be shallow.
          fetch-depth: 0
      - name: Landed branches are gone
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          stale=$(git branch -r --merged origin/main | grep -vE 'origin/(main|HEAD)$' || true)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "A landed branch outlives its landing; delete it locally and on the remote in the push that moves main."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Audit selftest
        run: python scripts/audit_docs.py --selftest
      - name: Docs
        run: python scripts/audit_docs.py
      - name: Lint
        run: ruff check . && lint-imports
      - name: Credential heuristics, advisory
        continue-on-error: true
        run: ruff check --select S105,S106 .
      - name: Type-check
        run: mypy app main.py db scripts tests
      - name: Test
        run: pytest
