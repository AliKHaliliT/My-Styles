name: CI

# Runs the five commands AGENTS.md documents, so a rule the configuration claims to enforce
# is actually enforced rather than remembered.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prose
        run: |
          if git grep -PIn "\x{2014}"; then
            echo "Em dashes are banned in every tracked byte."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Docs
        run: python scripts/audit_docs.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && lint-imports
      - name: Type-check
        run: mypy app main.py db scripts tests
      - name: Test
        run: pytest
