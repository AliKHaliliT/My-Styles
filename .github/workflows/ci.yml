name: CI

# The family's four seats live in one repository, and GitHub only reads workflows from a
# repository root. Each template therefore carries its own workflow file, which sits inert
# here and activates once that template becomes the root of a project. This file is what
# checks the seats inside this repository, running the gate each one documents, the five
# commands of an artifact style and the audits of the host, plus the family checks that hold
# the shared law identical. The pip-installable seats also prove the wheel they build,
# installed into a scratch environment and imported, because an editable install never
# exercises packaging. Actions are pinned by commit for the same reason the family audit
# holds carried law by digest, because a tag can move and a digest cannot.

on:
  push:
  pull_request:

jobs:
  em-dashes:
    name: Em dashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Em dash budget, two per file
        run: |
          git grep -PIno "\x{2014}" -- . > em-dashes.tmp || true
          awk -F: '{count[$1]++} END {bad = 0; for (f in count) if (count[f] > 2) { printf "%s carries %d em dashes; the budget is two per file\n", f, count[f]; bad = 1 }; exit bad}' em-dashes.tmp
          rm em-dashes.tmp
      - name: Prose heuristics, advisory
        continue-on-error: true
        run: |
          if git grep -inE "paradigm shift|game.changer|ever-evolving|cutting.edge|\bdelve|\btapestry\b|\bsupercharge|\btransformative\b|\bmultifaceted\b|\bmeticulous\b|\bparamount\b|\bembark\b|it.s worth noting|at the end of the day|in today.s world|let.s dive|going forward|a testament to|marks a pivotal|plays a vital role|experts agree|studies show|widely regarded as" -- . ":(exclude)*.github*" ":(exclude)*docs/CONVENTIONS.md" ":(exclude)*docs/decisions/*" ":(exclude)*docs/claims/*" ":(exclude)treasury"; then
            echo "Inflated vocabulary or weasel attribution in living prose; the verdict is review's."
            exit 1
          fi
      - name: Spelling, advisory
        continue-on-error: true
        run: |
          if ! pipx run codespell==2.4.3 --skip ".git,node_modules,.hypothesis,__pycache__,dist,package-lock.json,*.svg,*.png,*.ico,*.woff,*.woff2,*.map,treasury,decisions,claims,reviews,inherited,mockServiceWorker.js" --ignore-words-list "accreting,afterall" .; then
            echo "Misspellings in living prose or code; correct each, or name a domain term in the ignore list."
            exit 1
          fi

  family:
    name: Family law
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shared blocks are one text
        run: python3 scripts/audit_family.py

  audit-scripts:
    name: Audit scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Lint and type-check the family's own tooling
        run: |
          python -m pip install ruff mypy
          ruff check --isolated scripts Quiver/scripts
          mypy --strict scripts/audit_family.py scripts/rehearse_adoption.py Quiver/scripts/audit_inquiry.py

  # The audits are proven where they run. A child is built from each template, shaped the way
  # adoption shapes it, with the records in an inherited folder, its own numbering after them, an
  # upstream file with an entry, a record committed before the audit arrived, and Windows line
  # endings, and the child's own gate must pass, so a check is never green only in the tree that
  # lacks the conditions it was written for.
  rehearsal:
    name: Adoption rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Install
        run: python -m pip install grimp
      - name: Rehearse
        run: python scripts/rehearse_adoption.py

  # The scan gates on the question it settles, whether anything matches its pattern
  # set. Whether a confidential fact reached a tracked byte is the hard rule's
  # question, which no scanner decides, and review carries it.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  archetypecore:
    name: ArchetypeCore
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ArchtypeCore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Record immutability is checked against history, so the clone cannot be shallow.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Docs
        run: python scripts/audit_docs.py
      - name: Seams
        run: |
          if git grep -nE "monkeypatch|unittest\.mock|mock\.patch|MonkeyPatch" -- tests; then
            echo "Module mocking is banned; substitute only at a declared seam."
            exit 1
          fi
      - name: Lint
        run: ruff check . && lint-imports
      - name: Credential heuristics, advisory
        continue-on-error: true
        run: ruff check --select S105,S106 .
      - name: Type-check
        run: mypy app main.py db scripts tests
      - name: Test
        run: pytest

  keel:
    name: Keel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Keel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Record immutability is checked against history, so the clone cannot be shallow.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --group dev
      - name: Docs
        run: python scripts/audit_docs.py
      - name: Seams
        run: |
          if git grep -nE "monkeypatch|unittest\.mock|mock\.patch|MonkeyPatch" -- tests; then
            echo "Module mocking is banned; substitute only at a declared seam."
            exit 1
          fi
      - name: Lint
        run: ruff check . && lint-imports
      - name: Credential heuristics, advisory
        continue-on-error: true
        run: ruff check --select S105,S106 .
      - name: Type-check
        run: mypy src tests
      - name: Test
        run: pytest
      - name: Package
        run: |
          python -m pip install build
          python -m build
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-check/bin/python" -c "import importlib, tomllib; importlib.import_module(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])"


  quiver:
    name: Quiver
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Quiver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Claim pins are verified against history, so the clone cannot be shallow.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Audit selftest
        run: python scripts/audit_inquiry.py --selftest
      - name: Audit
        run: python scripts/audit_inquiry.py
      - name: Install the demo arrow
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e arrows/coinwise
          python -m pip install --group arrows/coinwise/pyproject.toml:dev
      - name: Arrow docs
        run: cd arrows/coinwise && python scripts/audit_docs.py
      - name: Arrow seams
        run: |
          if git grep -nE "monkeypatch|unittest\.mock|mock\.patch|MonkeyPatch" -- arrows/coinwise/tests; then
            echo "Module mocking is banned; substitute only at a declared seam."
            exit 1
          fi
      - name: Arrow lint
        run: cd arrows/coinwise && ruff check . && lint-imports
      - name: Arrow credential heuristics, advisory
        continue-on-error: true
        run: cd arrows/coinwise && ruff check --select S105,S106 .
      - name: Arrow type-check
        run: cd arrows/coinwise && mypy src tests
      - name: Arrow test
        run: cd arrows/coinwise && pytest
      - name: Arrow package
        run: |
          cd arrows/coinwise
          python -m pip install build
          python -m build
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-check/bin/python" -c "import importlib, tomllib; importlib.import_module(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])"

  helm:
    name: Helm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Helm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Record immutability is checked against history, so the clone cannot be shallow.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Helm/package-lock.json
      - name: Docs
        run: node scripts/audit-docs.mjs
      - name: Seams
        run: |
          if git grep -nE "vi\.mock\(" -- tests; then
            echo "Module mocking is banned; substitute only at a declared seam."
            exit 1
          fi
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
