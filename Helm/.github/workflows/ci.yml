name: CI

# Runs the five commands AGENTS.md documents, plus the build, so the layer rule and the token
# rule ESLint carries are actually enforced rather than remembered.
# Actions ride major-version tags so a child of this template starts current; pin them to commit digests when your threat model warrants hardening.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Record immutability is checked against history, so the clone cannot be shallow.
          fetch-depth: 0
      - name: Landed branches are gone
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          stale=$(git branch -r --merged origin/main | grep -vE 'origin/(main|HEAD)$' || true)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "A landed branch outlives its landing; delete it locally and on the remote in the push that moves main."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: |
          npm ci
          # The docs audit's spelling advisory runs where codespell is installed.
          pipx install codespell
      - name: Audit selftest
        run: node scripts/audit-docs-selftest.mjs
      - name: Docs
        run: node scripts/audit-docs.mjs
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
