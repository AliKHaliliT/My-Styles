name: CI

# Runs the five commands AGENTS.md documents, plus the build, so the layer rule and the token
# rule ESLint carries are actually enforced rather than remembered.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prose
        run: |
          if git grep -PIn "\x{2014}"; then
            echo "Em dashes are banned in every tracked byte."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Docs
        run: node scripts/audit-docs.mjs
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
