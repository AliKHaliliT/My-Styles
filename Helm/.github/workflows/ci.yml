name: CI

# Runs the five commands AGENTS.md documents, plus the build, so the layer rule and the token
# rule ESLint carries are actually enforced rather than remembered.
# Actions ride major-version tags so a child of this template starts current; pin them to commit digests when your threat model warrants hardening.

# A push to a branch of this repository is that branch's run, so a job runs on a pull request only
# when the request comes from a fork, whose push never reaches this repository.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  landing:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.evidence.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Landed branches are gone
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          stale=$(git branch -r --merged origin/main | grep -vE 'origin/(main|HEAD)$' || true)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "A landed branch outlives its landing; delete it locally and on the remote in the push that moves main."
            exit 1
          fi
      - name: Evidence of a run this commit already passed
        id: evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fast-forward keeps the commit, so a branch run that passed at this commit has seen this tree whole;
          # the gate is not repeated for it and only this landing check runs. Without that evidence the gate runs.
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=50" --jq '[.workflow_runs[] | select(.head_branch != "main" and .event == "push")] | length' 2>/dev/null || echo 0)
          if [ "${passed:-0}" -gt 0 ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "a branch run passed at ${GITHUB_SHA}, so the gate is not repeated; only the landing check ran"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    needs: landing
    if: ${{ needs.landing.outputs.verified != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Record immutability is checked against history, so the clone cannot be shallow.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: |
          npm ci
          # The docs audit's spelling advisory runs where codespell is installed.
          pipx install codespell
      - name: Dependency audit, advisory
        continue-on-error: true
        # The tree the lock installs, read against the advisories the registry has published by the day of the
        # run; a finding is review's to fix or dismiss in writing.
        run: npm audit
      - name: Audit selftest
        run: node scripts/audit-docs-selftest.mjs
      - name: Docs
        run: node scripts/audit-docs.mjs
      - name: Seams
        run: |
          if git grep -nE "vi\.mock\(" -- tests; then
            echo "Module mocking is banned; substitute only at a declared seam."
            exit 1
          fi
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
