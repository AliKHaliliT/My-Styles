[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coinwise"
# An arrow serves an inquiry rather than consumers: it versions no releases.
version = "0.0.1"
description = "A Keel-style library arrow measuring rounding drift in monetary accumulation."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Ali Khalili Tazehkandgheshlagh" },
]
keywords = [
    "arrow",
    "rounding",
    "drift",
    "decimal",
    "keel",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/AliKHaliliT/My-Styles"

[dependency-groups]
dev = [
    "hypothesis",
    "pytest",
    "pytest-randomly",
    "ruff",
    "mypy",
    "import-linter",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coinwise"]

[tool.isort]
known_first_party = ["coinwise"]
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# The D codes check docstring presence only, never format, because the docstring rhythm is
# the house's own; the shape rules live in Keel's README Conventions, which this arrow
# follows. PGH keeps every ignore honest: a suppression names the exact code it silences.
select = ["E", "F", "B", "UP", "Q", "PGH", "PERF", "C4", "S", "RET504", "D101", "D102", "D103", "D107", "C901", "PLR0915", "PLR1702", "T20"]
# The credential heuristics cannot decide their own question and may not gate; they run as
# advice through `ruff check --select S105,S106 .` per the family's checking rules.
ignore = ["E501", "S105", "S106"]
# The nesting-depth rule still sits in ruff's preview set. Naming it above enables it alone;
# explicit-preview-rules keeps every other preview rule out of the selection.
preview = true
explicit-preview-rules = true

# The three function-shape limits, gated because a count decides itself: ten paths through a
# function, five nested blocks, fifty statements. The inherited record 0053 carries why these
# three and why ten.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-nested-blocks = 5
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Suites document themselves through case names and assertions, and assert for a living.
"tests/**" = ["D101", "D102", "D103", "D107", "S101"]
# A script's output is its purpose; everywhere else a print is a diagnostic left behind,
# and the logger is where a diagnostic goes.
"scripts/*.py" = ["T201"]

# import-linter machine-checks the Dependency Rule. The layer directories are bare
# namespace packages by convention, so they are listed as portions.
[tool.importlinter]
root_packages = [
    "coinwise.domain",
    "coinwise.services",
    "coinwise.facade",
]

[[tool.importlinter.contracts]]
name = "The Dependency Rule points one way"
type = "layers"
layers = ["coinwise.facade", "coinwise.services", "coinwise.domain"]

[tool.mypy]
python_version = "3.14"
strict = true
implicit_reexport = true

[tool.pytest.ini_options]
# The suite runs in a shuffled order under a seed the run prints, so a test that leans on
# its neighbour fails on the day it is written; replay a run with --randomly-seed=<printed>.
testpaths = ["tests"]
# A deprecation warning is a removal notice at least two releases early, so it gates here
# rather than scrolling past unread. Any exception is a named ignore for one specific
# message with a reason beside it, never a blanket.
filterwarnings = ["error"]
