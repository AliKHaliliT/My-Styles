name: CI

# Runs the commands AGENTS.md documents, so a rule the configuration claims to
# enforce is actually enforced rather than remembered. This file sits inert
# while the template is nested inside another repository and activates when it
# becomes a repository root.
# Actions ride major-version tags so a child of this template starts current; pin them to commit digests when your threat model warrants hardening.

# A push to a branch of this repository is that branch's run, so a job runs on a pull request only
# when the request comes from a fork, whose push never reaches this repository.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  landing:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.evidence.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Landed branches are gone
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          stale=$(git branch -r --merged origin/main | grep -vE 'origin/(main|HEAD)$' || true)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "A landed branch outlives its landing; delete it locally and on the remote in the push that moves main."
            exit 1
          fi
      - name: Evidence of a run this commit already passed
        id: evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fast-forward keeps the commit, so a branch run that passed at this commit has seen this tree whole;
          # the gate is not repeated for it and only this landing check runs. Without that evidence the gate runs.
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=50" --jq '[.workflow_runs[] | select(.head_branch != "main" and .event == "push")] | length' 2>/dev/null || echo 0)
          if [ "${passed:-0}" -gt 0 ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "a branch run passed at ${GITHUB_SHA}, so the gate is not repeated; only the landing check ran"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

  inquiry:
    runs-on: ubuntu-latest
    needs: landing
    if: ${{ needs.landing.outputs.verified != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Pins are verified against history, so the clone cannot be shallow.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install codespell for the spelling advisory
        run: python -m pip install codespell
      - name: Audit selftest
        run: python scripts/audit_inquiry.py --selftest
      - name: Audit
        run: python scripts/audit_inquiry.py

  coinwise:
    runs-on: ubuntu-latest
    needs: landing
    if: ${{ needs.landing.outputs.verified != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    defaults:
      run:
        working-directory: arrows/coinwise
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Record immutability is checked against history, so the clone cannot be shallow.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --group dev
      - name: Docs
        run: python scripts/audit_docs.py
      - name: Seams
        run: |
          if git grep -nE "monkeypatch|unittest\.mock|mock\.patch|MonkeyPatch" -- tests; then
            echo "Module mocking is banned; substitute only at a declared seam."
            exit 1
          fi
      - name: Lint
        run: ruff check . && lint-imports
      - name: Credential heuristics, advisory
        continue-on-error: true
        run: ruff check --select S105,S106 .
      - name: Type-check
        run: mypy src tests
      - name: Test
        run: pytest
