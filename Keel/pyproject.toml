[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel"
# A style is not a product: it versions no releases, so the number never moves.
version = "0.0.1"
description = "A strict, AI-ready Clean Architecture template for Python packages."
readme = "README.md"
# The style's floor rather than a stack binding. The exemplars name a class in its own annotations
# unquoted, which only deferred annotations allow, so a project on an older interpreter is off the style.
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Ali Khalili Tazehkandgheshlagh" },
]
keywords = [
    "template",
    "clean-architecture",
    "ddd",
    "agent",
    "engine",
    "pydantic",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "hypothesis",
    "pytest",
    "pytest-asyncio",
    "pytest-randomly",
    "pytest-socket",
    "codespell",
    "ruff",
    "mypy",
    "import-linter",
]

[project.scripts]
keel = "keel.facade.cli:main"

[project.urls]
Repository = "https://github.com/AliKHaliliT/My-Styles"

[tool.hatch.build.targets.wheel]
packages = ["src/keel"]

[tool.isort]
known_first_party = ["keel"]
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 100
# The style's floor, as requires-python says; the lint reads the exemplars as the interpreter does.
target-version = "py314"

[tool.ruff.lint]
# The D codes check docstring presence only, never format, because the docstring rhythm is
# the house's own; the shape rules live in the README's Conventions section. PGH keeps every
# ignore honest: a suppression names the exact code it silences, never a blanket.
select = ["E", "F", "B", "UP", "Q", "PGH", "PERF", "C4", "S", "RET504", "D101", "D102", "D103", "D107", "C901", "PLR0915", "PLR1702", "T20"]
# The credential heuristics read any suggestive string as a possible secret, so they
# cannot decide their own question and may not gate. They leave the gating selection and
# run as advice instead, through `ruff check --select S105,S106 .`; decision 0025 carries
# the principle and AGENTS.md states what a warning obliges.
ignore = ["E501", "S105", "S106"]
# The subprocess and URL-opening heuristics, S603, S607 and S310 among them, fire at a call site
# and not on a string, so they stay in the gate. A literal argument list needs nothing; a call that
# builds its arguments or opens a guarded URL earns a suppression naming the code with its reason
# beside it at the reviewed site, which is the review written where the call is, as the docs
# audit's own calls show.
# The nesting-depth rule still sits in ruff's preview set. Naming it above enables it alone;
# explicit-preview-rules keeps every other preview rule out of the selection.
preview = true
explicit-preview-rules = true

# The three function-shape limits, gated because a count decides itself: ten paths through a
# function, five nested blocks, fifty statements. Decision 0053 carries why these three and
# why ten.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-nested-blocks = 5
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# A port's stub is a one-line signature; its documentation lives on each implementation.
"src/keel/domain/interfaces/*.py" = ["D102"]
# Suites document themselves through case names and assertions (see docs/CONVENTIONS.md).
# A suite asserts for a living, and its fixtures carry throwaway credentials by design.
"tests/**" = ["D101", "D102", "D103", "D107", "S101"]
# A script's output is its purpose, and so is a command's; everywhere else a print is a
# diagnostic left behind, and the logger is where a diagnostic goes.
"scripts/*.py" = ["T201"]
"src/keel/facade/cli/*.py" = ["T201"]

# import-linter machine-checks the Dependency Rule the same way ESLint carries the client
# style's layer rule. Locating the portions imports the package root once, which the
# library-citizenship rule (no import-time side effects) makes safe; everything after that
# is parsed rather than executed.
[tool.importlinter]
# The layer directories are bare namespace packages by convention, so they are listed as
# portions; a single "keel" root would make grimp skip every directory with no __init__.py.
root_packages = [
    "keel.adapters",
    "keel.core",
    "keel.domain",
    "keel.facade",
    "keel.services",
]
# External packages must be in the graph for a contract to forbid an SDK by name.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core stays inside the ports"
type = "forbidden"
source_modules = ["keel.domain", "keel.services"]
forbidden_modules = [
    "keel.facade",
    "keel.adapters",
    # Stack binding: the demo's one vendor SDK, kept out of the core by name.
    "google",
]

[[tool.importlinter.contracts]]
name = "The Dependency Rule points one way"
type = "layers"
layers = ["keel.facade", "keel.services", "keel.domain"]

[tool.mypy]
# The style's floor, as requires-python says; the checker reads the exemplars as the interpreter does.
python_version = "3.14"
strict = true
# Every grouping directory is a bare namespace package, so the checker takes the source root as
# its import base rather than inferring one per folder, and two suites that share a file name in
# different folders stay two modules instead of one duplicate.
explicit_package_bases = true
mypy_path = "src"
# Stack binding: the demo validates with pydantic.
plugins = ["pydantic.mypy"]
implicit_reexport = true

# Stack binding: the demo's vendor SDK ships no types.
[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
# The suite runs in a shuffled order under a seed the run prints, so a test that leans on
# its neighbour fails on the day it is written; replay a run with --randomly-seed=<printed>.
# Stack binding: the demo's suites are async.
asyncio_mode = "auto"
testpaths = ["tests"]
# A suite cannot reach a provider or the network, because pytest-socket refuses every connection
# that would leave the loopback, so an adapter that resolves its credentials from the environment
# fails here before it bills; a test that must reach a host names it with @pytest.mark.allow_hosts,
# in the open. The loopback stays open because the event loop wakes itself through a socket pair.
# A suite is imported by its path rather than its bare file name, so two units that share a name
# in different folders both keep the suite name the mirror gives them; under the default mode the
# file name was global to the tree and the second suite of a name was refused at collection.
addopts = "--allow-hosts=127.0.0.1,::1 --import-mode=importlib"
# A deprecation warning is a removal notice at least two releases early, so it gates here
# rather than scrolling past unread. Any exception is a named ignore for one specific
# message with a reason beside it, never a blanket.
filterwarnings = ["error"]
