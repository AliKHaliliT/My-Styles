[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel"
version = "1.0.0"
description = "A strict, AI-ready Clean Architecture template for Python packages."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Ali Khalili Tazehkandgheshlagh" },
]
keywords = [
    "template",
    "clean-architecture",
    "ddd",
    "agent",
    "engine",
    "pydantic",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.116",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[project.scripts]
keel = "keel.facade.cli:main"

[project.urls]
Repository = "https://github.com/AliKHaliliT/My-Styles"

[tool.hatch.build.targets.wheel]
packages = ["src/keel"]

[tool.isort]
known_first_party = ["keel"]
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
