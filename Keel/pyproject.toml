[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel"
# A style is not a product: it versions no releases, so the number never moves.
version = "0.0.1"
description = "A strict, AI-ready Clean Architecture template for Python packages."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Ali Khalili Tazehkandgheshlagh" },
]
keywords = [
    "template",
    "clean-architecture",
    "ddd",
    "agent",
    "engine",
    "pydantic",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.116",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "import-linter",
]

[project.scripts]
keel = "keel.facade.cli:main"

[project.urls]
Repository = "https://github.com/AliKHaliliT/My-Styles"

[tool.hatch.build.targets.wheel]
packages = ["src/keel"]

[tool.isort]
known_first_party = ["keel"]
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# The D codes check docstring presence only, never format, because the docstring rhythm is
# the house's own; the shape rules live in the README's Conventions section.
select = ["E", "F", "B", "UP", "Q", "D101", "D102", "D103", "D107"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# A port's stub is a one-line signature; its documentation lives on each implementation.
"src/keel/domain/interfaces/*.py" = ["D102"]
# Suites document themselves through case names and assertions (see docs/CONVENTIONS.md).
"tests/**" = ["D101", "D102", "D103", "D107"]

# import-linter machine-checks the Dependency Rule the same way ESLint carries the client
# style's layer rule. Locating the portions imports the package root once, which the
# library-citizenship rule (no import-time side effects) makes safe; everything after that
# is parsed rather than executed.
[tool.importlinter]
# The layer directories are bare namespace packages by convention, so they are listed as
# portions; a single "keel" root would make grimp skip every directory with no __init__.py.
root_packages = [
    "keel.adapters",
    "keel.core",
    "keel.domain",
    "keel.facade",
    "keel.services",
]
# External packages must be in the graph for a contract to forbid an SDK by name.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core stays inside the ports"
type = "forbidden"
source_modules = ["keel.domain", "keel.services"]
forbidden_modules = [
    "keel.facade",
    "keel.adapters",
    "anthropic",
]

[[tool.importlinter.contracts]]
name = "The Dependency Rule points one way"
type = "layers"
layers = ["keel.facade", "keel.services", "keel.domain"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
